<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login / Signup — Akash Dry Fruits</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="site-header"></div>

<div class="container section" style="max-width:460px;">
  <div class="card">
    <div style="display:flex;gap:0;margin-bottom:20px;border:1.5px solid var(--gray-200);border-radius:999px;overflow:hidden;">
      <button id="tab-login" class="btn btn-block" style="border-radius:0;background:var(--gold-600);color:#fff;" onclick="showTab('login')">Login</button>
      <button id="tab-signup" class="btn btn-block" style="border-radius:0;background:#fff;color:var(--brown-900);" onclick="showTab('signup')">Sign Up</button>
    </div>

    <form id="login-form">
      <div class="form-group"><label>Email</label><input required type="email" name="email" /></div>
      <div class="form-group"><label>Password</label><input required type="password" name="password" /></div>
      <button class="btn btn-primary btn-block" type="submit">Login</button>
      <p style="text-align:center;margin-top:12px;"><a href="#" onclick="showTab('forgot');return false;" style="color:var(--gold-600);font-size:.85rem;">Forgot Password?</a></p>
    </form>

    <form id="signup-form" style="display:none;">
      <div class="form-group"><label>Full Name</label><input required name="name" /></div>
      <div class="form-group"><label>Email</label><input required type="email" name="email" /></div>
      <div class="form-group"><label>Mobile Number</label><input name="phone" pattern="[0-9]{10}" maxlength="10" /></div>
      <div class="form-group"><label>Password</label><input required type="password" name="password" minlength="6" /></div>
      <button class="btn btn-primary btn-block" type="submit">Create Account</button>
    </form>

    <form id="forgot-form" style="display:none;">
      <p style="color:var(--gray-500);font-size:.9rem;">Enter your registered email and we'll send you reset instructions.</p>
      <div class="form-group"><label>Email</label><input required type="email" name="email" /></div>
      <button class="btn btn-primary btn-block" type="submit">Send Reset Instructions</button>
      <p style="text-align:center;margin-top:12px;"><a href="#" onclick="showTab('login');return false;" style="color:var(--gold-600);font-size:.85rem;">Back to Login</a></p>
    </form>
  </div>
</div>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script>
if (Auth.isLoggedIn()) window.location.href = '/orders.html';

function showTab(tab) {
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('signup-form').style.display = tab === 'signup' ? 'block' : 'none';
  document.getElementById('forgot-form').style.display = tab === 'forgot' ? 'block' : 'none';
  document.getElementById('tab-login').style.background = tab === 'login' ? 'var(--gold-600)' : '#fff';
  document.getElementById('tab-login').style.color = tab === 'login' ? '#fff' : 'var(--brown-900)';
  document.getElementById('tab-signup').style.background = tab === 'signup' ? 'var(--gold-600)' : '#fff';
  document.getElementById('tab-signup').style.color = tab === 'signup' ? '#fff' : 'var(--brown-900)';
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    const { token, user } = await Api.login({ email: f.email.value, password: f.password.value });
    Auth.saveSession(token, user);
    window.location.href = '/orders.html';
  } catch (err) { toast(err.message); }
});

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    const { token, user } = await Api.signup({ name: f.name.value, email: f.email.value, phone: f.phone.value, password: f.password.value });
    Auth.saveSession(token, user);
    window.location.href = '/orders.html';
  } catch (err) { toast(err.message); }
});

document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const { message } = await Api.forgotPassword(e.target.email.value);
    toast(message);
    showTab('login');
  } catch (err) { toast(err.message); }
});
</script>
</body>
</html>
