<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Cart — Akash Dry Fruits</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="site-header"></div>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="/index.html">Home</a> / Cart</div>
    <h1>My Shopping Cart</h1>
  </div>
</div>

<div class="container section">
  <div class="grid-2col">
    <div id="cart-items"></div>
    <div class="card" id="cart-summary" style="height:fit-content;">
      <h3>Order Summary</h3>
      <div style="display:flex;justify-content:space-between;margin:10px 0;"><span>Subtotal</span><span id="sum-subtotal">₹0</span></div>
      <div style="display:flex;justify-content:space-between;margin:10px 0;"><span>Delivery</span><span id="sum-delivery">₹0</span></div>
      <div class="divider"></div>
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;"><span>Total</span><span id="sum-total">₹0</span></div>
      <p style="font-size:.8rem;color:var(--gray-500);margin-top:8px;">Orders above ₹999 get FREE delivery. Below that, ₹60 delivery charge applies.</p>
      <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="window.location.href='/checkout.html'">Proceed to Checkout</button>
      <a href="/shop.html" class="btn btn-outline btn-block" style="margin-top:10px;">Continue Shopping</a>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
<script>
function renderCart() {
  const items = Cart.get();
  const container = document.getElementById('cart-items');
  if (!items.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🛒</div><h3>Your cart is empty</h3><p>Add some delicious dry fruits to get started!</p><a href="/shop.html" class="btn btn-primary">Shop Now</a></div>`;
  } else {
    container.innerHTML = items.map((i, idx) => `
      <div class="card" style="display:flex;gap:16px;margin-bottom:14px;align-items:center;">
        <img src="${i.image || '/images/placeholder.jpg'}" style="width:80px;height:80px;object-fit:cover;border-radius:10px;" onerror="this.src='/images/placeholder.jpg'"/>
        <div style="flex:1;">
          <h4 style="margin:0 0 4px;">${i.name}</h4>
          <span class="badge badge-gold">${i.pack_size}</span>
          <div style="margin-top:8px;display:flex;align-items:center;gap:10px;">
            <button class="btn btn-outline btn-sm" onclick="qtyChange(${i.product_id}, '${i.pack_size}', -1)">−</button>
            <span>${i.quantity}</span>
            <button class="btn btn-outline btn-sm" onclick="qtyChange(${i.product_id}, '${i.pack_size}', 1)">+</button>
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:700;">${formatINR(i.unit_price * i.quantity)}</div>
          <div style="font-size:.78rem;color:var(--gray-500);">${formatINR(i.unit_price)} each</div>
          <button class="btn btn-sm" style="color:var(--red-600);background:none;margin-top:6px;" onclick="removeItem(${i.product_id}, '${i.pack_size}')">Remove</button>
        </div>
      </div>`).join('');
  }
  const subtotal = Cart.subtotal();
  const delivery = items.length === 0 ? 0 : (subtotal >= 999 ? 0 : 60);
  document.getElementById('sum-subtotal').textContent = formatINR(subtotal);
  document.getElementById('sum-delivery').textContent = delivery === 0 ? 'FREE' : formatINR(delivery);
  document.getElementById('sum-total').textContent = formatINR(subtotal + delivery);
}

function qtyChange(productId, packSize, delta) {
  const items = Cart.get();
  const item = items.find(i => i.product_id === productId && i.pack_size === packSize);
  if (item) Cart.updateQty(productId, packSize, item.quantity + delta);
  renderCart();
}
function removeItem(productId, packSize) { Cart.remove(productId, packSize); renderCart(); toast('Item removed from cart'); }

renderCart();
</script>
</body>
</html>
